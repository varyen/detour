<!doctype html>
<!--
  Исходник картинки для og:image. Рендерится в img/og.png ровно 1200×630
  скриптом landing/shoot/og.cjs — открывать в браузере как страницу не нужно.
  Стиль — как у страницы: чертёжный лист, чернила, бирюзовая отметка.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: #eef2f7; color: #14213d;
        font: 16px/1.5 "Commissioner", "Segoe UI", Roboto, Arial, sans-serif;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(20,33,61,.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,33,61,.16) 1px, transparent 1px),
          linear-gradient(rgba(20,33,61,.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,33,61,.06) 1px, transparent 1px);
        background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; opacity: .55;
      }
      .art { position: absolute; inset: 0 0 0 520px; }
      .art img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 34%); mask-image: linear-gradient(90deg, transparent, #000 34%); }
      .in { position: relative; padding: 58px 0 0 64px; width: 600px; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
      .brand svg { width: 34px; height: 34px; }
      h1 { margin: 34px 0 18px; font-size: 58px; line-height: 1.02; letter-spacing: -.03em; font-weight: 800; }
      p { margin: 0; color: #3d4a66; font-size: 21px; max-width: 520px; }
      .spec { margin-top: 30px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px;
        font: 14px "JetBrains Mono", ui-monospace, Consolas, monospace; }
      .spec dt { color: #7a869e; } .spec dd { margin: 0; color: #14213d; }
      .frame { position: absolute; inset: 22px; border: 1.5px solid rgba(20,33,61,.5); pointer-events: none; }
      .stamp { position: absolute; right: 40px; bottom: 34px; font: 500 12px "JetBrains Mono", monospace; letter-spacing: .08em; color: #7a869e; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="art"><img src="gen/blueprint.webp" alt="" /></div>
    <div class="frame"></div>
    <div class="in">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="dm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#2ea043"/></linearGradient></defs><rect width="32" height="32" rx="7" fill="url(#dm)"/><g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21H10C14 21 14 9 16.5 9S19 21 23 21h2"/><path d="M22 17.8 26.2 21 22 24.2"/></g><circle cx="16.5" cy="21" r="2.7" fill="#f85149" stroke="#0f1419"/></svg>
        Detour
      </div>
      <h1>Обход блокировок — для всей сети или одного устройства</h1>
      <p>sing-box и zapret под одной панелью: на роутере или приложением на компьютере и телефоне.</p>
      <dl class="spec">
        <dt>роутер</dt><dd>OpenWrt / GL.iNet · Keenetic</dd>
        <dt>приложение</dt><dd>Windows · macOS · Android</dd>
        <dt>лицензия</dt><dd>MIT · открытый код</dd>
      </dl>
    </div>
    <div class="stamp">DETOUR.VARYEN.NET</div>
  </body>
</html>
