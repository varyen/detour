[workspace]
resolver = "2"
members = ["crates/core", "crates/svc", "app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
detour-core = { path = "crates/core" }
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_System_IO", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
