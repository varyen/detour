# `app` крейт собирается с crate-type = ["staticlib", "cdylib", "rlib"] — cdylib
# нужен Android (.so), staticlib нужен iOS (Xcode линкует его в приложение сам).
# Но cdylib линкуется СРАЗУ, целиком, а на iOS extern "C" detour_tunnel_* в
# ios.rs определены не в Rust, а в Swift (DetourTunnel.swift, @_cdecl) — их
# символов ещё нет на этапе cargo build, только на финальной сборке приложения
# в Xcode. `-undefined dynamic_lookup` разрешает недостающие символы при сборке
# .dylib и откладывает их поиск на время загрузки — staticlib это не касается
# (её линковка и так отложена до Xcode), а .dylib на iOS не используется вообще.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]
